# Adds Prometheus and Grafana to the normal stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Grafana:    http://localhost:3001  (dashboard "AI Summarizer", opens without login, read-only)
# Prometheus: http://localhost:9090
#
# Both are bound to localhost only. The token below is a fixed development value (it must match
# observability/metrics_token); never reuse it anywhere reachable from the internet.
services:
  go-api:
    environment:
      - METRICS_TOKEN=local-dev-metrics-token

  python-ai-service:
    environment:
      - METRICS_TOKEN=local-dev-metrics-token

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    depends_on:
      - go-api
      - python-ai-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/ai-summarizer.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
