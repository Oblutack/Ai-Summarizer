version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - misspell
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        # Error strings are shown to users as sentences, so capitals and full stops are intended.
        - -ST1005
        # Package comments and receiver-name style are not worth enforcing here.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

formatters:
  enable:
    - gofmt
