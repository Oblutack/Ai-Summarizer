name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-api
    # A real Postgres for the migration and pagination integration tests.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: summarizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d summarizer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DSN: host=localhost port=5432 user=user password=password dbname=summarizer_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-api/go.mod
      - run: go vet ./...
      - run: go test ./...

  python-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-ai-service/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
